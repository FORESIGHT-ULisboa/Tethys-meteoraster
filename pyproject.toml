[build-system]
# setuptools>=77 is required for PEP 639 SPDX `license` / `license-files` support.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meteoraster"
version = "3.0"
description = "Module for handling distributed ensemble and probabilistic forecast data (5-D meteorological rasters)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jose Pedro Matos", email = "jose.matos@tecnico.ulisboa.pt" },
]
keywords = ["meteorology", "forecast", "ensemble", "raster", "netcdf", "grib", "ERA5", "ERA5-Land"]
# NOTE: no "License :: OSI Approved :: ..." classifier - PyPI rejects license
# classifiers when a PEP 639 SPDX `license` expression is present.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Pip-installable runtime dependencies.
# NOTE: GDAL / `osgeo` is NOT listed here on purpose - it is a system/conda
# dependency that pip cannot install reliably. Install it through the conda
# environment (see environment.yml). The KML aggregation helpers
# (get_values_from_KML / get_quantiles_from_KML) require it.
dependencies = [
    "numpy>=1.26",
    "scipy",
    "pandas",
    "xarray",
    "netcdf4",
    "h5netcdf",
    # h5netcdf >=1.6 has pluggable backends and no longer depends on h5py, so a
    # bare `pip install h5netcdf` yields a backend-less install and save()/load()
    # raise ImportError at open time. Declare it explicitly.
    "h5py",
    "cfgrib",
    "cdsapi",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "cartopy",
    "beautifulsoup4",
    "openpyxl",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
build = ["build", "twine"]
dev = ["pytest", "pytest-cov", "build", "twine", "jupyterlab"]

[project.urls]
Homepage = "https://github.com/FORESIGHT-ULisboa/Tethys-meteoraster"
Repository = "https://github.com/FORESIGHT-ULisboa/Tethys-meteoraster"
Issues = "https://github.com/FORESIGHT-ULisboa/Tethys-meteoraster/issues"
Changelog = "https://github.com/FORESIGHT-ULisboa/Tethys-meteoraster/releases"
"FORESIGHT" = "https://foresight.tecnico.ulisboa.pt/"

[tool.setuptools.packages.find]
include = ["meteoraster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The "experimental" UserWarnings raised by some methods are intentional and noisy
# in the test output, so they are ignored. DeprecationWarnings are intentionally
# left visible so future numpy/pandas deprecations surface during testing.
filterwarnings = [
    "ignore::UserWarning",
]
