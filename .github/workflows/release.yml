name: Release

# Tag push (v*) -> build, publish to PyPI, attach artifacts to the GitHub release.
# Manual run    -> build, publish to TestPyPI (default) or PyPI, no tag needed.
#
# Authentication is PyPI Trusted Publishing (OIDC): no API tokens are stored.
# The `pypi` / `testpypi` environment names below must match what is registered
# as the publisher on each index. See AGENTS.md for the one-time setup.
#
# Artifacts are built into `dist-release/`, NOT `dist/`: this repository commits
# historical wheels under `dist/`, and those predate `long_description`, so a
# `twine check --strict dist/*` would fail on them. Building elsewhere keeps the
# check and the upload scoped to what this run actually produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions: {}

env:
  OUTDIR: dist-release

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify version consistency
        run: python .github/scripts/check_version.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir "$OUTDIR"

      - name: Check package metadata
        run: python -m twine check --strict "$OUTDIR"/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-release
          path: dist-release/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-release
          path: dist-release/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-release/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-release
          path: dist-release/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-release/

  github-release:
    name: Attach artifacts to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-release
          path: dist-release/

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* --generate-notes
          fi
